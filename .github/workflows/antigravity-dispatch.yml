name: Antigravity Review Dispatch

on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  dispatch:
    permissions:
      contents: read
      pull-requests: read
      actions: write
    if: >-

      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '@agy /review') &&
       (github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR'))

    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and Commit Information
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_PR: ${{ github.event.issue.number }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            TARGET_PR="$ISSUE_PR"
            TARGET_SHA=$(gh api "repos/${REPO}/pulls/${TARGET_PR}" --jq .head.sha)
          else
            TARGET_PR="$PR_NUM"
            TARGET_SHA="$PR_SHA"
          fi
          echo "pr_number=${TARGET_PR}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"

      - name: Trigger Antigravity Review Workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # ratchet:actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr_info.outputs.pr_number }}
          COMMIT_SHA: ${{ steps.pr_info.outputs.commit_sha }}
        with:
          github-token: ${{ secrets.PAT_WORKFLOW_DISPATCH || secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'antigravity-review.yml',
                ref: context.payload.repository?.default_branch || 'main',
                inputs: {
                  pr_number: process.env.PR_NUMBER,
                  commit_sha: process.env.COMMIT_SHA
                }
              });
            } catch (error) {
              if (error.status === 404) {
                core.warning(
                  'Workflow antigravity-review.yml not found on default ' +
                  'branch. This is expected while introducing the workflow; ' +
                  'it will become active once merged into main.'
                );
              } else {
                throw error;
              }
            }
