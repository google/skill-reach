name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # ratchet:astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups --all-extras

      - name: Test
        run: uv run pytest -q

      - name: Run Integration Tests
        run: uv run pytest -q -m integration

      - name: Verify documentation
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: uv run mkdocs build --strict

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Check web assets with Biome
        run: npx --yes @biomejs/biome ci

      - name: Check Markdown formatting
        run: npx --yes prettier --check "**/*.md"

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uvx ty check
